name: Dispatch

on:
  push:
    branches: [main, master]
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to phlix-plugins catalog
        env:
          GH_TOKEN: ${{ secrets.PHLIX_BOT_TOKEN }}
        run: |
          gh api repos/detain/phlix-plugins/dispatches \
            --field event_type=plugin-push \
            --field client_payload='{"ref":"${{ github.ref }}","sha":"${{ github.sha }}","repo":"${{ github.repository }}"}'
