name: Dispatch

on:
  push:
    branches: [main, master]
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to phlix-plugins catalog
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "detain",
              repo: "phlix-plugins",
              event_type: "plugin-push",
              client_payload: {
                ref: context.ref,
                sha: context.sha,
                repo: context.repo
              }
            });

