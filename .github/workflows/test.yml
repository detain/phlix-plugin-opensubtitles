name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@5cf914a880e8ad8c24f08c6e6e4e8e7a5c2b8f93  # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

      # phpunit.xml declares <report><cobertura outputFile="coverage.xml"/>, and
      # setup-php provides pcov above, so ./coverage.xml is written by the run
      # itself - no extra --coverage flag is needed.
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@e71723c4e5c6e1d7c9b9d7e4c6f3a2b1c4d5e6f7  # v1
        # Never allowed to fail the build: a missing/expired token or a Codacy
        # outage must not turn CI red.
        continue-on-error: true
        # One upload only - both matrix legs produce an identical report.
        if: matrix.php == '8.3'
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage.xml

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse src --level=9

      - name: Run PHPCS
        run: vendor/bin/phpcs src --standard=PSR12
